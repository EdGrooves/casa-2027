<title>Căutare apartament</title>
<style>
:root { --bg:#f3f5f7; --surface:#fff; --ink:#18212b; --muted:#5b6876; --line:#d9e0e7; --accent:#1f4f8f; --bad:#a3322a; color-scheme: light; }
@media (prefers-color-scheme: dark) { :root { --bg:#11161c; --surface:#19212a; --ink:#e8edf2; --muted:#9aa7b4; --line:#2c3742; --accent:#8db7f0; --bad:#f08b80; color-scheme: dark; } }
body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--ink); font:17px/1.5 "Segoe UI", system-ui, sans-serif; padding:0 max(16px, env(safe-area-inset-left,0px)); }
form { width:min(380px, 100%); background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:24px; display:grid; gap:14px; box-sizing:border-box; }
h1 { margin:0; font-size:1.35rem; }
p { margin:0; color:var(--muted); }
label { font-weight:600; }
input[type=password] { width:100%; box-sizing:border-box; font:inherit; padding:10px 12px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--ink); }
.row { display:flex; gap:8px; align-items:center; font-weight:400; }
button { font:inherit; font-weight:600; padding:11px; border:0; border-radius:8px; background:var(--accent); color:var(--surface); cursor:pointer; }
button:focus-visible, input:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
.err { color:var(--bad); }
</style>
</head>

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const KEY_ID = 'ws-key-' + P.salt;
async function open(rawKey) {
  const key = await crypto.subtle.importKey('raw', rawKey, 'AES-GCM', false, ['decrypt']);
  const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(P.iv) }, key, b64(P.ct));
  const html = new TextDecoder().decode(plain);
  // With a remembered key this runs while the login page is still loading; document.open() is ignored then and the page
  // would be appended below the login form. Wait until parsing is done so the page replaces it.
  if (document.readyState === 'loading') await new Promise(r => document.addEventListener('DOMContentLoaded', r, { once: true }));
  document.open(); document.write(html); document.close();
}
async function derive(pw) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);
  return new Uint8Array(await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: b64(P.salt), iterations: P.iter }, base, 256));
}
(async () => {
  let saved = null; try { saved = localStorage.getItem(KEY_ID); } catch (e) {}
  if (saved) { try { await open(b64(saved)); return; } catch (e) { try { localStorage.removeItem(KEY_ID); } catch (e2) {} } }
  document.getElementById('pw').focus();
})();
document.getElementById('f').addEventListener('submit', async ev => {
  ev.preventDefault();
  const btn = document.getElementById('go'), err = document.getElementById('err');
  btn.disabled = true; btn.textContent = 'Se deschide…'; err.hidden = true;
  try {
    const remember = document.getElementById('rem').checked;
    const raw = await derive(document.getElementById('pw').value);
    await open(raw); // replaces this document with the real page
    if (remember) { try { localStorage.setItem(KEY_ID, btoa(String.fromCharCode(...raw))); } catch (e) {} }
  } catch (e) {
    btn.disabled = false; btn.textContent = 'Deschide'; err.hidden = false;
  }
});
})();
